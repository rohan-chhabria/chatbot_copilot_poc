# =============================================================================
# Production Release — Docker Build + ECS Fargate Deploy
# =============================================================================
# Triggers: Manual dispatch only (no auto-deploy on push to main)
# Supports: dev, staging, or prod (each requires approval via GitHub Environment)
#
# Prerequisites (one-time):
#   1. IAM OIDC provider for GitHub Actions (scripts/setup-github-actions-aws.sh)
#   2. IAM role per repo (scripts/create-github-actions-role.sh)
#   3. GitHub Secrets per environment: AWS_DEPLOY_ROLE_ARN, DEPLOYMENT_ID
#   4. GitHub Environments: dev, staging (w/ reviewers), prod (w/ reviewers)
#   5. CloudFormation stack deployed with infra/template.yaml
# =============================================================================

name: Release

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment (staging and prod require approval)"
        required: true
        default: dev
        type: choice
        options: [dev, staging, prod]

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1

jobs:
  # ---------------------------------------------------------------------------
  # CI: Lint & Security (runs once before deploy)
  # ---------------------------------------------------------------------------
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
          pip install bandit

      - name: Lint with ruff
        run: ruff check src/ tests/ --output-format=github

      - name: Security scan with bandit
        run: bandit -r src/ --skip B101,B104,B108,B110,B311,B404,B603,B607

  # ---------------------------------------------------------------------------
  # Deploy: Docker build → ECR push → ECS redeploy
  # ---------------------------------------------------------------------------
  deploy:
    needs: ci
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image tag
        id: image
        run: |
          ENV="${{ github.event.inputs.environment }}"
          DEPLOY_ID="${{ secrets.DEPLOYMENT_ID }}"
          REPO="${{ steps.ecr-login.outputs.registry }}/inmate-copilot-${DEPLOY_ID}-${ENV}"
          SHA_TAG="${REPO}:${{ github.sha }}"
          LATEST_TAG="${REPO}:latest"
          echo "repo=${REPO}" >> $GITHUB_OUTPUT
          echo "sha_tag=${SHA_TAG}" >> $GITHUB_OUTPUT
          echo "latest_tag=${LATEST_TAG}" >> $GITHUB_OUTPUT

      - name: Build Docker image
        run: |
          docker build \
            -t ${{ steps.image.outputs.sha_tag }} \
            -t ${{ steps.image.outputs.latest_tag }} \
            .

      - name: Push to ECR
        run: |
          docker push ${{ steps.image.outputs.sha_tag }}
          docker push ${{ steps.image.outputs.latest_tag }}

      - name: Update ECS service
        run: |
          ENV="${{ github.event.inputs.environment }}"
          DEPLOY_ID="${{ secrets.DEPLOYMENT_ID }}"
          CLUSTER="InmateCopilot-${DEPLOY_ID}-${ENV}"
          SERVICE="InmateCopilot-${DEPLOY_ID}-${ENV}"

          aws ecs update-service \
            --cluster "${CLUSTER}" \
            --service "${SERVICE}" \
            --force-new-deployment \
            --region ${{ env.AWS_REGION }}

          echo "Waiting for service to stabilize..."
          aws ecs wait services-stable \
            --cluster "${CLUSTER}" \
            --services "${SERVICE}" \
            --region ${{ env.AWS_REGION }}

      - name: Summary
        run: |
          ENV="${{ github.event.inputs.environment }}"
          echo "## Released InmateCopilot to ${ENV}" >> $GITHUB_STEP_SUMMARY
          echo "- Commit: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Image: \`${{ steps.image.outputs.sha_tag }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Cluster: \`InmateCopilot-${{ secrets.DEPLOYMENT_ID }}-${ENV}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Region: \`${{ env.AWS_REGION }}\`" >> $GITHUB_STEP_SUMMARY
