AWSTemplateFormatVersion: "2010-09-09"
Description: >
  InmateCopilot V2 — ECS Fargate deployment with ElastiCache.
  Multi-tenant chatbot with text-to-SQL, document QA, and daily activity pipelines.
  Push to dev/main → CI passes → Auto-deploy.

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, staging, prod]
    Description: Deployment environment (used for resource naming).

  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC for ECS tasks, ALB, and ElastiCache.

  PublicSubnets:
    Type: List<AWS::EC2::Subnet::Id>
    Description: Public subnets for the ALB (at least 2 AZs).

  PrivateSubnets:
    Type: List<AWS::EC2::Subnet::Id>
    Description: Private subnets for ECS tasks and ElastiCache (at least 2 AZs).

  ContainerImage:
    Type: String
    Default: ""
    Description: ECR image URI. Leave empty on first deploy (ECR created by stack).

  CertificateArn:
    Type: String
    Default: ""
    Description: ACM certificate ARN for HTTPS. Leave empty for HTTP-only.

  SentryDsn:
    Type: String
    Default: ""
    Description: Sentry DSN for error monitoring.

  AllowedOrigins:
    Type: String
    Default: "*"
    Description: CORS allowed origins.

  RedisNodeType:
    Type: String
    Default: cache.t4g.micro
    AllowedValues:
      - cache.t4g.micro
      - cache.t4g.small
      - cache.t4g.medium
      - cache.r7g.large
    Description: ElastiCache node type.

Conditions:
  IsProd: !Equals [!Ref Environment, "prod"]
  HasCertificate: !Not [!Equals [!Ref CertificateArn, ""]]
  HasSentry: !Not [!Equals [!Ref SentryDsn, ""]]
  HasContainerImage: !Not [!Equals [!Ref ContainerImage, ""]]

Resources:

  # ═══════════════════════════════════════════════════════════════════════════
  #  DynamoDB Tables
  # ═══════════════════════════════════════════════════════════════════════════

  ConversationTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub "InmateCopilot-Conversations-${Environment}"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  CustomerConfigTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub "ChatbotCustomerConfiguration-${Environment}"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: customer_key
          AttributeType: S
      KeySchema:
        - AttributeName: customer_key
          KeyType: HASH

  # ═══════════════════════════════════════════════════════════════════════════
  #  ECR Repository
  # ═══════════════════════════════════════════════════════════════════════════

  EcrRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Sub "inmate-copilot-${Environment}"
      ImageScanningConfiguration:
        ScanOnPush: true
      LifecyclePolicy:
        LifecyclePolicyText: |
          {
            "rules": [
              {
                "rulePriority": 1,
                "description": "Keep last 10 images",
                "selection": {
                  "tagStatus": "any",
                  "countType": "imageCountMoreThan",
                  "countNumber": 10
                },
                "action": { "type": "expire" }
              }
            ]
          }

  # ═══════════════════════════════════════════════════════════════════════════
  #  ElastiCache Redis (Session Store)
  # ═══════════════════════════════════════════════════════════════════════════

  RedisSubnetGroup:
    Type: AWS::ElastiCache::SubnetGroup
    Properties:
      Description: Subnet group for InmateCopilot Redis
      SubnetIds: !Ref PrivateSubnets

  RedisSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Redis security group for InmateCopilot
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 6379
          ToPort: 6379
          SourceSecurityGroupId: !Ref EcsSecurityGroup

  RedisCluster:
    Type: AWS::ElastiCache::CacheCluster
    Properties:
      ClusterName: !Sub "ic-redis-${Environment}"
      Engine: redis
      EngineVersion: "7.1"
      CacheNodeType: !Ref RedisNodeType
      NumCacheNodes: 1
      CacheSubnetGroupName: !Ref RedisSubnetGroup
      VpcSecurityGroupIds:
        - !Ref RedisSecurityGroup
      Port: 6379

  # ═══════════════════════════════════════════════════════════════════════════
  #  ECS Cluster
  # ═══════════════════════════════════════════════════════════════════════════

  EcsCluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Sub "InmateCopilot-${Environment}"
      ClusterSettings:
        - Name: containerInsights
          Value: enabled

  # ═══════════════════════════════════════════════════════════════════════════
  #  CloudWatch Log Group
  # ═══════════════════════════════════════════════════════════════════════════

  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/ecs/inmate-copilot-${Environment}"
      RetentionInDays: !If [IsProd, 90, 30]

  # ═══════════════════════════════════════════════════════════════════════════
  #  IAM Roles
  # ═══════════════════════════════════════════════════════════════════════════

  TaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "InmateCopilot-ExecRole-${Environment}"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy

  TaskRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "InmateCopilot-TaskRole-${Environment}"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: DynamoDbAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                  - dynamodb:Query
                  - dynamodb:BatchWriteItem
                Resource:
                  - !GetAtt ConversationTable.Arn
                  - !Sub "${ConversationTable.Arn}/index/*"
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                Resource:
                  - !GetAtt CustomerConfigTable.Arn

  # ═══════════════════════════════════════════════════════════════════════════
  #  Security Groups
  # ═══════════════════════════════════════════════════════════════════════════

  AlbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: ALB security group for InmateCopilot
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0

  EcsSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: ECS tasks security group for InmateCopilot
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 8000
          ToPort: 8000
          SourceSecurityGroupId: !Ref AlbSecurityGroup

  # ═══════════════════════════════════════════════════════════════════════════
  #  Application Load Balancer
  # ═══════════════════════════════════════════════════════════════════════════

  ApplicationLoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: !Sub "InmateCopilot-${Environment}"
      Scheme: internet-facing
      Type: application
      Subnets: !Ref PublicSubnets
      SecurityGroups:
        - !Ref AlbSecurityGroup
      LoadBalancerAttributes:
        - Key: idle_timeout.timeout_seconds
          Value: "300"

  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub "IC-TG-${Environment}"
      Port: 8000
      Protocol: HTTP
      VpcId: !Ref VpcId
      TargetType: ip
      HealthCheckPath: /health
      HealthCheckIntervalSeconds: 30
      HealthCheckTimeoutSeconds: 5
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      TargetGroupAttributes:
        - Key: deregistration_delay.timeout_seconds
          Value: "30"

  HttpListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref ApplicationLoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - !If
          - HasCertificate
          - Type: redirect
            RedirectConfig:
              Protocol: HTTPS
              Port: "443"
              StatusCode: HTTP_301
          - Type: forward
            TargetGroupArn: !Ref TargetGroup

  HttpsListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Condition: HasCertificate
    Properties:
      LoadBalancerArn: !Ref ApplicationLoadBalancer
      Port: 443
      Protocol: HTTPS
      Certificates:
        - CertificateArn: !Ref CertificateArn
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref TargetGroup

  # ═══════════════════════════════════════════════════════════════════════════
  #  ECS Task Definition
  # ═══════════════════════════════════════════════════════════════════════════

  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Condition: HasContainerImage
    Properties:
      Family: !Sub "InmateCopilot-${Environment}"
      Cpu: !If [IsProd, "1024", "512"]
      Memory: !If [IsProd, "2048", "1024"]
      NetworkMode: awsvpc
      RequiresCompatibilities:
        - FARGATE
      ExecutionRoleArn: !GetAtt TaskExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      ContainerDefinitions:
        - Name: inmate-copilot
          Image: !Ref ContainerImage
          Essential: true
          PortMappings:
            - ContainerPort: 8000
              Protocol: tcp
          Environment:
            - Name: ENVIRONMENT
              Value: !Ref Environment
            - Name: CONVERSATION_TABLE
              Value: !Ref ConversationTable
            - Name: CUSTOMER_CONFIG_TABLE
              Value: !Ref CustomerConfigTable
            - Name: REDIS_HOST
              Value: !GetAtt RedisCluster.RedisEndpoint.Address
            - Name: REDIS_PORT
              Value: !GetAtt RedisCluster.RedisEndpoint.Port
            - Name: SESSION_BACKEND
              Value: redis
            - Name: LTM_BACKEND
              Value: dynamodb
            - Name: CHROMA_STORAGE_DIR
              Value: /app/chroma_db
            - Name: DOC_CHROMA_DIR
              Value: /app/chroma_docs
            - Name: ENABLE_GUARDRAILS
              Value: "true"
            - Name: LOG_LEVEL
              Value: !If [IsProd, "WARNING", "INFO"]
            - Name: STRICT_TENANT_VALIDATION
              Value: "false"
            - Name: SENTRY_DSN
              Value: !If [HasSentry, !Ref SentryDsn, ""]
            - Name: ALLOWED_ORIGINS
              Value: !Ref AllowedOrigins
          HealthCheck:
            Command:
              - CMD-SHELL
              - python -c "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')" || exit 1
            Interval: 30
            Timeout: 5
            Retries: 3
            StartPeriod: 60
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref "AWS::Region"
              awslogs-stream-prefix: ecs

  # ═══════════════════════════════════════════════════════════════════════════
  #  ECS Service
  # ═══════════════════════════════════════════════════════════════════════════

  EcsService:
    Type: AWS::ECS::Service
    Condition: HasContainerImage
    DependsOn: HttpListener
    Properties:
      ServiceName: !Sub "InmateCopilot-${Environment}"
      Cluster: !Ref EcsCluster
      TaskDefinition: !Ref TaskDefinition
      DesiredCount: !If [IsProd, 2, 1]
      LaunchType: FARGATE
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          Subnets: !Ref PrivateSubnets
          SecurityGroups:
            - !Ref EcsSecurityGroup
      LoadBalancers:
        - ContainerName: inmate-copilot
          ContainerPort: 8000
          TargetGroupArn: !Ref TargetGroup
      DeploymentConfiguration:
        MinimumHealthyPercent: 100
        MaximumPercent: 200
      HealthCheckGracePeriodSeconds: 120

  # ═══════════════════════════════════════════════════════════════════════════
  #  Auto Scaling
  # ═══════════════════════════════════════════════════════════════════════════

  ScalableTarget:
    Type: AWS::ApplicationAutoScaling::ScalableTarget
    Condition: HasContainerImage
    Properties:
      ServiceNamespace: ecs
      ScalableDimension: ecs:service:DesiredCount
      ResourceId: !Sub "service/${EcsCluster}/${EcsService.Name}"
      MinCapacity: !If [IsProd, 2, 1]
      MaxCapacity: !If [IsProd, 10, 3]
      RoleARN: !Sub "arn:aws:iam::${AWS::AccountId}:role/aws-service-role/ecs.application-autoscaling.amazonaws.com/AWSServiceRoleForApplicationAutoScaling_ECSService"

  CpuScalingPolicy:
    Type: AWS::ApplicationAutoScaling::ScalingPolicy
    Condition: HasContainerImage
    Properties:
      PolicyName: !Sub "InmateCopilot-CPU-${Environment}"
      PolicyType: TargetTrackingScaling
      ScalingTargetId: !Ref ScalableTarget
      TargetTrackingScalingPolicyConfiguration:
        PredefinedMetricSpecification:
          PredefinedMetricType: ECSServiceAverageCPUUtilization
        TargetValue: 70
        ScaleOutCooldown: 60
        ScaleInCooldown: 300

  # ═══════════════════════════════════════════════════════════════════════════
  #  CloudWatch Alarms
  # ═══════════════════════════════════════════════════════════════════════════

  Alb5xxAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "InmateCopilot-ALB-5xx-${Environment}"
      AlarmDescription: ALB returning errors
      Namespace: AWS/ApplicationELB
      MetricName: HTTPCode_Target_5XX_Count
      Dimensions:
        - Name: LoadBalancer
          Value: !GetAtt ApplicationLoadBalancer.LoadBalancerFullName
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 10
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

Outputs:
  ApiUrl:
    Description: API endpoint URL (use this to access the chatbot)
    Value: !If
      - HasCertificate
      - !Sub "https://${ApplicationLoadBalancer.DNSName}"
      - !Sub "http://${ApplicationLoadBalancer.DNSName}"

  EcrRepositoryUri:
    Description: ECR repository URI (push Docker images here)
    Value: !GetAtt EcrRepository.RepositoryUri

  RedisEndpoint:
    Description: Redis endpoint for session storage
    Value: !Sub "${RedisCluster.RedisEndpoint.Address}:${RedisCluster.RedisEndpoint.Port}"

  ConversationTableName:
    Description: DynamoDB table for conversation history
    Value: !Ref ConversationTable

  CustomerConfigTableName:
    Description: DynamoDB table for customer configuration
    Value: !Ref CustomerConfigTable

  EcsClusterName:
    Description: ECS cluster name
    Value: !Ref EcsCluster

  EcsServiceName:
    Description: ECS service name
    Condition: HasContainerImage
    Value: !GetAtt EcsService.Name
