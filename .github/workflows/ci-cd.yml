name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: inmate-copilot
  ECS_CLUSTER: inmate-copilot-cluster
  ECS_SERVICE_DEV: inmate-copilot-dev
  ECS_SERVICE_PROD: inmate-copilot-prod

jobs:
  # ══════════════════════════════════════════════════════════════
  # STAGE 1: Lint & Type Check
  # ══════════════════════════════════════════════════════════════
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run Ruff (lint)
        run: ruff check src/ tests/ --output-format=github

      - name: Run Ruff (format check)
        run: ruff format src/ tests/ --check

      - name: Run MyPy (type check)
        run: mypy src/ --ignore-missing-imports --no-error-summary
        continue-on-error: true  # Warning only for now

  # ══════════════════════════════════════════════════════════════
  # STAGE 2: Unit Tests
  # ══════════════════════════════════════════════════════════════
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Run unit tests with coverage
        env:
          SESSION_BACKEND: memory
          LTM_BACKEND: noop
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          pytest tests/unit/ -v \
            --cov=src \
            --cov-report=xml \
            --cov-report=term-missing \
            --junitxml=junit-unit.xml

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: coverage.xml
          flags: unit
          fail_ci_if_error: false

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-results
          path: junit-unit.xml

  # ══════════════════════════════════════════════════════════════
  # STAGE 3: Integration Tests
  # ══════════════════════════════════════════════════════════════
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: unit-tests
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Run integration tests
        env:
          SESSION_BACKEND: redis
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          LTM_BACKEND: noop
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          MYSQL_HOST: ${{ secrets.MYSQL_HOST }}
          MYSQL_DATABASE: ${{ secrets.MYSQL_DATABASE }}
          MYSQL_USER: ${{ secrets.MYSQL_USER }}
          MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
        run: |
          pytest tests/integration/ -v \
            --junitxml=junit-integration.xml

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-test-results
          path: junit-integration.xml

  # ══════════════════════════════════════════════════════════════
  # STAGE 4: Contract Tests (Postman/Newman)
  # ══════════════════════════════════════════════════════════════
  contract-tests:
    name: Contract Tests
    runs-on: ubuntu-latest
    needs: integration-tests
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Start API server
        env:
          SESSION_BACKEND: redis
          REDIS_HOST: localhost
          LTM_BACKEND: noop
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          uvicorn src.api.handler:app --host 0.0.0.0 --port 8000 &
          sleep 10
          curl -f http://localhost:8000/health || exit 1

      - name: Install Newman
        run: npm install -g newman newman-reporter-htmlextra

      - name: Run contract tests
        run: |
          newman run tests/contract/postman_collection.json \
            --environment tests/contract/env-local.json \
            --reporters cli,htmlextra,junit \
            --reporter-htmlextra-export newman-report.html \
            --reporter-junit-export newman-junit.xml \
            || true

      - name: Upload Newman report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: newman-report
          path: |
            newman-report.html
            newman-junit.xml

  # ══════════════════════════════════════════════════════════════
  # STAGE 5: Build & Push Docker Image
  # ══════════════════════════════════════════════════════════════
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    outputs:
      image_tag: ${{ steps.build.outputs.image_tag }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        id: build
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          
          # Tag as latest for branch
          if [ "${{ github.ref }}" == "refs/heads/main" ]; then
            docker tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:latest
            docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
          elif [ "${{ github.ref }}" == "refs/heads/develop" ]; then
            docker tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:develop
            docker push $ECR_REGISTRY/$ECR_REPOSITORY:develop
          fi
          
          echo "image_tag=$IMAGE_TAG" >> $GITHUB_OUTPUT

  # ══════════════════════════════════════════════════════════════
  # STAGE 6: Deploy to Dev (develop branch)
  # ══════════════════════════════════════════════════════════════
  deploy-dev:
    name: Deploy to Dev
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/develop'
    environment: development

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update ECS service
        run: |
          aws ecs update-service \
            --cluster ${{ env.ECS_CLUSTER }} \
            --service ${{ env.ECS_SERVICE_DEV }} \
            --force-new-deployment

      - name: Wait for deployment
        run: |
          aws ecs wait services-stable \
            --cluster ${{ env.ECS_CLUSTER }} \
            --services ${{ env.ECS_SERVICE_DEV }}

  # ══════════════════════════════════════════════════════════════
  # STAGE 7: Deploy to Prod (main branch, manual approval)
  # ══════════════════════════════════════════════════════════════
  deploy-prod:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    environment: production  # Requires manual approval in GitHub

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update ECS service
        run: |
          aws ecs update-service \
            --cluster ${{ env.ECS_CLUSTER }} \
            --service ${{ env.ECS_SERVICE_PROD }} \
            --force-new-deployment

      - name: Wait for deployment
        run: |
          aws ecs wait services-stable \
            --cluster ${{ env.ECS_CLUSTER }} \
            --services ${{ env.ECS_SERVICE_PROD }}

  # ══════════════════════════════════════════════════════════════
  # STAGE 8: Smoke Tests (Post-Deploy)
  # ══════════════════════════════════════════════════════════════
  smoke-tests:
    name: Smoke Tests
    runs-on: ubuntu-latest
    needs: [deploy-dev, deploy-prod]
    if: always() && (needs.deploy-dev.result == 'success' || needs.deploy-prod.result == 'success')

    steps:
      - uses: actions/checkout@v4

      - name: Set target URL
        id: target
        run: |
          if [ "${{ needs.deploy-prod.result }}" == "success" ]; then
            echo "url=${{ secrets.PROD_API_URL }}" >> $GITHUB_OUTPUT
          else
            echo "url=${{ secrets.DEV_API_URL }}" >> $GITHUB_OUTPUT
          fi

      - name: Health check
        run: |
          curl -f ${{ steps.target.outputs.url }}/health

      - name: Pipeline health checks
        run: |
          curl -f ${{ steps.target.outputs.url }}/pipelines/health/inmate_data
          curl -f ${{ steps.target.outputs.url }}/pipelines/health/document_qa
          curl -f ${{ steps.target.outputs.url }}/pipelines/health/daily_activity

      - name: Basic chat flow
        run: |
          RESPONSE=$(curl -s -X POST ${{ steps.target.outputs.url }}/chat \
            -H "Content-Type: application/json" \
            -d '{"question":"hello","customer_key":"demo","user_id":"smoketest"}')
          
          echo "$RESPONSE" | jq .
          
          # Verify session_id returned
          echo "$RESPONSE" | jq -e '.session_id' || exit 1
