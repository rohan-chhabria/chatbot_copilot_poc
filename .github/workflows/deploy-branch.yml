# =============================================================================
# Branch-based Auto Deployment
# =============================================================================
# - develop branch → deploys to 'dev' environment (automatic)
# =============================================================================

name: Deploy (Branch)

on:
  push:
    branches: [develop]

permissions:
  id-token: write
  contents: read

jobs:
  # ===========================================================================
  # Lint (quick validation before deploy)
  # ===========================================================================
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - run: pip install ruff
      - run: ruff check src/ --output-format=github

  # ===========================================================================
  # DEVELOP BRANCH → Dev environment
  # ===========================================================================
  deploy-dev:
    name: Deploy to Dev
    needs: lint
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install SAM CLI
        run: pip install aws-sam-cli

      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Create ECR Repository (if not exists)
        id: create-ecr
        run: |
          REPO_NAME="inmate-copilot-dev"
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          REGION="${{ secrets.AWS_REGION || 'us-east-1' }}"
          ECR_URI="${ACCOUNT_ID}.dkr.ecr.${REGION}.amazonaws.com/${REPO_NAME}"

          aws ecr describe-repositories --repository-names $REPO_NAME 2>/dev/null || \
            aws ecr create-repository --repository-name $REPO_NAME --image-scanning-configuration scanOnPush=true

          echo "ecr_uri=${ECR_URI}" >> $GITHUB_OUTPUT

      - name: Build & Push Docker Image
        run: |
          ECR_URI="${{ steps.create-ecr.outputs.ecr_uri }}"
          docker build -t $ECR_URI:${{ github.sha }} -t $ECR_URI:latest -f dockerfile .
          docker push $ECR_URI:${{ github.sha }}
          docker push $ECR_URI:latest

      - name: SAM Build
        working-directory: infra
        run: sam build --template-file template.yaml

      - name: SAM Deploy
        working-directory: infra
        run: |
          ECR_URI="${{ steps.create-ecr.outputs.ecr_uri }}"
          sam deploy \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --config-env dev \
            --image-repository $ECR_URI \
            --parameter-overrides "ContainerImage=$ECR_URI:${{ github.sha }}"

      - name: Wait for ECS Service
        run: |
          echo "Waiting for ECS service to stabilize..."
          aws ecs wait services-stable \
            --cluster InmateCopilot-dev \
            --services InmateCopilot-dev --no-cli-pager || echo "Service may still be starting"

      - name: Summary
        run: |
          echo "## ✅ Deployed to dev" >> $GITHUB_STEP_SUMMARY
          echo "- Commit: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Stack: \`InmateCopilot-dev\`" >> $GITHUB_STEP_SUMMARY
          echo "- Image: \`${{ steps.create-ecr.outputs.ecr_uri }}:${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY

  # ===========================================================================
  # Smoke Test
  # ===========================================================================
  smoke-test:
    name: Smoke Test
    needs: deploy-dev
    runs-on: ubuntu-latest
    if: success()

    steps:
      - name: Health check
        run: |
          API_URL="${{ secrets.DEV_API_URL }}"
          if [ -z "$API_URL" ]; then
            echo "DEV_API_URL not set, skipping smoke test"
            exit 0
          fi
          
          for i in 1 2 3 4 5; do
            if curl -sf $API_URL/health; then
              echo "Health check passed"
              exit 0
            fi
            echo "Attempt $i failed, retrying in 30s..."
            sleep 30
          done
          echo "Health check failed after 5 attempts"
          exit 1

      - name: Basic chat test
        run: |
          API_URL="${{ secrets.DEV_API_URL }}"
          if [ -z "$API_URL" ]; then
            echo "DEV_API_URL not set, skipping chat test"
            exit 0
          fi
          
          RESPONSE=$(curl -s -X POST $API_URL/chat \
            -H "Content-Type: application/json" \
            -d '{"question":"hello","customer_key":"14","user_id":"smoketest","facility_ids":[63]}')
          echo "$RESPONSE" | jq -e '.session_id' || exit 1
          echo "Chat test passed"
