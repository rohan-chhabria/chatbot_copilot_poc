# =============================================================================
# CI Workflow — Runs on every PR and push
# =============================================================================
# Validates code quality: lint, format, unit tests
# Does NOT deploy — just validates
# =============================================================================

name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

jobs:
  validate:
    name: Lint & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Lint with Ruff
        run: |
          echo "::group::Running ruff"
          ruff check src/ --output-format=github
          echo "::endgroup::"

      - name: Format check
        run: |
          echo "::group::Format check"
          ruff format src/ --check
          echo "::endgroup::"

      - name: Run unit tests
        env:
          SESSION_BACKEND: memory
          LTM_BACKEND: noop
        run: |
          echo "::group::Running pytest"
          pytest tests/unit/ -v --tb=short --junitxml=test-results.xml || true
          echo "::endgroup::"

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: test-results.xml
          retention-days: 7
