version = 0.1

# =============================================================================
# DEV ENVIRONMENT — Auto-deploy on push to develop branch
# =============================================================================
[dev.deploy.parameters]
stack_name = "InmateCopilot-dev"
resolve_s3 = true
s3_prefix = "inmate-copilot-sam-dev"
region = "us-east-1"
capabilities = "CAPABILITY_IAM CAPABILITY_NAMED_IAM"
confirm_changeset = false
fail_on_empty_changeset = false
parameter_overrides = [
    "Environment=dev",
    "VpcId=vpc-0a4ecb80e63042970",
    "PublicSubnets=subnet-003339d87c6ea3eb1,subnet-0eb3e2c5f3ca00b0a",
    "PrivateSubnets=subnet-003339d87c6ea3eb1,subnet-0eb3e2c5f3ca00b0a",
    "RedisNodeType=cache.t4g.micro",
    "AllowedOrigins=*",
]

[dev.validate.parameters]
template_file = "template.yaml"
region = "us-east-1"

[dev.build.parameters]
template_file = "template.yaml"


# =============================================================================
# STAGING ENVIRONMENT
# =============================================================================
[staging.deploy.parameters]
stack_name = "InmateCopilot-staging"
resolve_s3 = true
s3_prefix = "inmate-copilot-sam-staging"
region = "us-east-1"
capabilities = "CAPABILITY_IAM CAPABILITY_NAMED_IAM"
confirm_changeset = false
fail_on_empty_changeset = false
parameter_overrides = [
    "Environment=staging",
    "VpcId=vpc-REPLACE_WITH_YOUR_VPC",
    "PublicSubnets=subnet-PUBLIC1,subnet-PUBLIC2",
    "PrivateSubnets=subnet-PRIVATE1,subnet-PRIVATE2",
    "RedisNodeType=cache.t4g.small",
    "SentryDsn=YOUR_SENTRY_DSN",
    "AllowedOrigins=https://staging.yourdomain.com",
]

[staging.validate.parameters]
template_file = "template.yaml"
region = "us-east-1"

[staging.build.parameters]
template_file = "template.yaml"


# =============================================================================
# PRODUCTION ENVIRONMENT — Manual approval required in GitHub
# =============================================================================
[prod.deploy.parameters]
stack_name = "InmateCopilot-prod"
resolve_s3 = true
s3_prefix = "inmate-copilot-sam-prod"
region = "us-east-1"
capabilities = "CAPABILITY_IAM CAPABILITY_NAMED_IAM"
confirm_changeset = false
fail_on_empty_changeset = false
parameter_overrides = [
    "Environment=prod",
    "VpcId=vpc-REPLACE_WITH_YOUR_VPC",
    "PublicSubnets=subnet-PUBLIC1,subnet-PUBLIC2",
    "PrivateSubnets=subnet-PRIVATE1,subnet-PRIVATE2",
    "RedisNodeType=cache.t4g.medium",
    "CertificateArn=arn:aws:acm:us-east-1:ACCOUNT:certificate/CERT_ID",
    "SentryDsn=YOUR_SENTRY_DSN",
    "AllowedOrigins=https://yourdomain.com",
]

[prod.validate.parameters]
template_file = "template.yaml"
region = "us-east-1"

[prod.build.parameters]
template_file = "template.yaml"
