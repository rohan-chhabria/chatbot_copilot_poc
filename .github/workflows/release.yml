# =============================================================================
# Production Release - Manual Deployment Only
# =============================================================================
# Triggers: Manual dispatch only (no auto-deploy on push to main)
# Supports: Single environment, multiple environments, or all
# Each environment requires approval via GitHub Environment protection rules
# =============================================================================

name: Release

on:
  workflow_dispatch:
    inputs:
      environments:
        description: "Environments (comma-separated, empty=all). Examples: 'prod' or 'staging,prod'"
        required: false
        type: string
        default: ""

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1

jobs:
  # ---------------------------------------------------------------------------
  # Prepare: Parse environments input
  # ---------------------------------------------------------------------------
  prepare:
    name: Prepare
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      env_list: ${{ steps.set-matrix.outputs.env_list }}
    steps:
      - name: Parse environments input
        id: set-matrix
        run: |
          INPUT="${{ github.event.inputs.environments }}"

          # Default: all production environments
          ALL_ENVS="staging,prod"

          if [ -z "$INPUT" ]; then
            ENVS="$ALL_ENVS"
            echo "Deploying to ALL environments: $ENVS"
          else
            ENVS="$INPUT"
            echo "Deploying to selected environments: $ENVS"
          fi

          # Convert to JSON array for matrix
          JSON_ARRAY=$(echo "$ENVS" | tr ',' '\n' | jq -R . | jq -s -c .)
          echo "matrix={\"environment\":$JSON_ARRAY}" >> $GITHUB_OUTPUT
          echo "env_list=$ENVS" >> $GITHUB_OUTPUT

          echo "Matrix: $JSON_ARRAY"

  # ---------------------------------------------------------------------------
  # CI: Lint & Test (runs once)
  # ---------------------------------------------------------------------------
  ci:
    name: CI Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: pip install ruff
      - name: Lint
        run: ruff check src/ --output-format=github
      - name: Format check
        run: ruff format src/ --check

  # ---------------------------------------------------------------------------
  # Deploy to selected environments (parallel, each with approval)
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy to ${{ matrix.environment }}
    needs: [prepare, ci]
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
    runs-on: ubuntu-latest
    environment: ${{ matrix.environment }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (${{ matrix.environment }})
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install SAM CLI
        run: pip install aws-sam-cli

      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Get ECR URI
        id: ecr-uri
        run: |
          REPO_NAME="sarah-chatbot-${{ matrix.environment }}"
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          ECR_URI="${ACCOUNT_ID}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${REPO_NAME}"
          echo "ecr_uri=${ECR_URI}" >> $GITHUB_OUTPUT

      - name: Build & Push Docker Image
        run: |
          ECR_URI="${{ steps.ecr-uri.outputs.ecr_uri }}"
          docker build -t $ECR_URI:${{ github.sha }} -t $ECR_URI:latest -f dockerfile .
          docker push $ECR_URI:${{ github.sha }}
          docker push $ECR_URI:latest

      - name: SAM Build
        working-directory: infra
        run: sam build --template-file template.yaml

      - name: SAM Deploy
        working-directory: infra
        run: |
          ECR_URI="${{ steps.ecr-uri.outputs.ecr_uri }}"
          sam deploy \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --config-env ${{ matrix.environment }} \
            --parameter-overrides "ContainerImage=$ECR_URI:${{ github.sha }}"

      - name: Wait for ECS Service
        run: |
          echo "Waiting for ECS service to stabilize..."
          aws ecs wait services-stable \
            --cluster SARAH-ChatBot-${{ matrix.environment }} \
            --services SARAH-ChatBot-${{ matrix.environment }} || echo "Service may still be starting"

      - name: Get API URL
        id: api
        run: |
          API_URL=$(aws cloudformation describe-stacks \
            --stack-name SARAH-ChatBot-${{ matrix.environment }} \
            --query "Stacks[0].Outputs[?OutputKey=='ApiUrl'].OutputValue" \
            --output text)
          echo "api_url=${API_URL}" >> $GITHUB_OUTPUT

      - name: Summary
        run: |
          echo "## ✅ Released to ${{ matrix.environment }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Item | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Stack | \`SARAH-ChatBot-${{ matrix.environment }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| API URL | ${{ steps.api.outputs.api_url }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Image | \`${{ steps.ecr-uri.outputs.ecr_uri }}:${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
