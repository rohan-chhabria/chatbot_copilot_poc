# ═══════════════════════════════════════════════════════════════════════════════
#  CI — Continuous Integration Pipeline
# ═══════════════════════════════════════════════════════════════════════════════
#
#  Every push or PR triggers:
#    1. Ruff lint
#    2. Mypy type check (non-blocking)
#    3. Pytest (unit + integration)
#    4. SAM template validation
#
# ═══════════════════════════════════════════════════════════════════════════════

name: CI — Lint & Test

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Lint with ruff
        run: ruff check src/ tests/ --output-format=github

      - name: Type check with mypy (non-blocking)
        run: mypy src/ --ignore-missing-imports || true

      - name: Run tests
        run: pytest tests/ -v --tb=short --junitxml=test-results.xml
        env:
          AWS_DEFAULT_REGION: us-east-1
          AWS_ACCESS_KEY_ID: testing
          AWS_SECRET_ACCESS_KEY: testing
          ENVIRONMENT: test

      - name: Validate SAM template
        run: |
          pip install aws-sam-cli
          sam validate --template infra/template.yaml --lint

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-py${{ matrix.python-version }}
          path: test-results.xml
