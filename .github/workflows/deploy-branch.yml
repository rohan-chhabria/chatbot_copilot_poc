# =============================================================================
# Branch-based Auto Deployment
# =============================================================================
# - develop branch → deploys to 'dev' environment
# - staging branch → deploys to 'staging' environment
# =============================================================================

name: Deploy (Branch)

on:
  push:
    branches: [develop, staging]

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1

jobs:
  # ===========================================================================
  # Determine Environment
  # ===========================================================================
  setup:
    name: Setup
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.env.outputs.environment }}
      stack_name: ${{ steps.env.outputs.stack_name }}
      ecr_repo: ${{ steps.env.outputs.ecr_repo }}
    steps:
      - name: Determine environment
        id: env
        run: |
          if [[ "${{ github.ref_name }}" == "develop" ]]; then
            echo "environment=dev" >> $GITHUB_OUTPUT
            echo "stack_name=SARAH-ChatBot-dev" >> $GITHUB_OUTPUT
            echo "ecr_repo=sarah-chatbot-dev" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref_name }}" == "staging" ]]; then
            echo "environment=staging" >> $GITHUB_OUTPUT
            echo "stack_name=SARAH-ChatBot-staging" >> $GITHUB_OUTPUT
            echo "ecr_repo=sarah-chatbot-staging" >> $GITHUB_OUTPUT
          fi

  # ===========================================================================
  # Lint (quick validation before deploy)
  # ===========================================================================
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - run: pip install ruff
      - run: ruff check src/ --output-format=github

  # ===========================================================================
  # Deploy
  # ===========================================================================
  deploy:
    name: Deploy to ${{ needs.setup.outputs.environment }}
    needs: [setup, lint]
    runs-on: ubuntu-latest
    environment: ${{ needs.setup.outputs.environment }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install SAM CLI
        run: pip install aws-sam-cli

      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Get ECR URI
        id: ecr-uri
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          ECR_URI="${ACCOUNT_ID}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ needs.setup.outputs.ecr_repo }}"
          echo "ecr_uri=${ECR_URI}" >> $GITHUB_OUTPUT

      - name: Build & Push Docker Image
        run: |
          ECR_URI="${{ steps.ecr-uri.outputs.ecr_uri }}"
          docker build -t $ECR_URI:${{ github.sha }} -t $ECR_URI:latest -f dockerfile .
          docker push $ECR_URI:${{ github.sha }}
          docker push $ECR_URI:latest

      - name: SAM Build
        working-directory: infra
        run: sam build --template-file template.yaml

      - name: SAM Deploy
        working-directory: infra
        run: |
          ECR_URI="${{ steps.ecr-uri.outputs.ecr_uri }}"
          sam deploy \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --config-env ${{ needs.setup.outputs.environment }} \
            --parameter-overrides "ContainerImage=$ECR_URI:${{ github.sha }}"

      - name: Wait for ECS Service
        run: |
          echo "Waiting for ECS service to stabilize..."
          aws ecs wait services-stable \
            --cluster ${{ needs.setup.outputs.stack_name }} \
            --services ${{ needs.setup.outputs.stack_name }} \
            --no-cli-pager || echo "Service may still be starting"

      - name: Get API URL
        id: api
        run: |
          API_URL=$(aws cloudformation describe-stacks \
            --stack-name ${{ needs.setup.outputs.stack_name }} \
            --query "Stacks[0].Outputs[?OutputKey=='ApiUrl'].OutputValue" \
            --output text)
          echo "api_url=${API_URL}" >> $GITHUB_OUTPUT

      - name: Summary
        run: |
          echo "## ✅ Deployed to ${{ needs.setup.outputs.environment }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Item | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Stack | \`${{ needs.setup.outputs.stack_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| API URL | ${{ steps.api.outputs.api_url }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Image | \`${{ steps.ecr-uri.outputs.ecr_uri }}:${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY

  # ===========================================================================
  # Smoke Test
  # ===========================================================================
  smoke-test:
    name: Smoke Test
    needs: [setup, deploy]
    runs-on: ubuntu-latest
    if: success()

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Get API URL
        id: api
        run: |
          API_URL=$(aws cloudformation describe-stacks \
            --stack-name ${{ needs.setup.outputs.stack_name }} \
            --query "Stacks[0].Outputs[?OutputKey=='ApiUrl'].OutputValue" \
            --output text)
          echo "api_url=${API_URL}" >> $GITHUB_OUTPUT

      - name: Health check
        run: |
          API_URL="${{ steps.api.outputs.api_url }}"
          echo "Testing: $API_URL/health"
          
          for i in 1 2 3 4 5; do
            RESPONSE=$(curl -sf "$API_URL/health" || echo "FAILED")
            if [[ "$RESPONSE" != "FAILED" ]]; then
              echo "Health check passed: $RESPONSE"
              exit 0
            fi
            echo "Attempt $i failed, retrying in 30s..."
            sleep 30
          done
          echo "Health check failed after 5 attempts"
          exit 1

      - name: Basic chat test
        run: |
          API_URL="${{ steps.api.outputs.api_url }}"
          
          RESPONSE=$(curl -s -X POST "$API_URL/chat" \
            -H "Content-Type: application/json" \
            -d '{"question":"hello","customer_key":"14","user_id":"smoketest","facility_ids":[63]}')
          
          echo "Response: $RESPONSE"
          echo "$RESPONSE" | jq -e '.session_id' || exit 1
          echo "Chat test passed"
